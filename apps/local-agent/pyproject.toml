[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haritayush-local-agent"
version = "0.1.0"
description = "HaritAyush Windows 10/11 local telemetry and safe demo workload agent."
requires-python = ">=3.11"
dependencies = ["psutil>=5.9,<8"]

[project.scripts]
haritayush-agent = "haritayush_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["haritayush_agent*"]

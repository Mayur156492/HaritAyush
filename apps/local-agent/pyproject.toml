[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haritayush-local-agent"
version = "0.1.0"
description = "HaritAyush Windows 11 local agent: capability discovery, telemetry collection, secure communication, safe workload execution, checkpointing and migration (scaffold)."
requires-python = ">=3.11"
# Intentionally empty in the scaffold: no hardware, telemetry or transport
# library has been chosen yet. Any dependency introduced later belongs here,
# inside apps/local-agent, and nowhere else.
dependencies = []

[tool.setuptools.packages.find]
include = ["haritayush_agent*"]
